spring:
  config:
    activate:
      on-profile: prod
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${PROD_DB_HOST:127.0.0.1}:${PROD_DB_PORT:3306}/open_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${PROD_DB_USERNAME:root}
    password: ${PROD_DB_PASSWORD}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      validation-query: SELECT 1
  redis:
    host: ${PROD_REDIS_HOST:127.0.0.1}
    port: ${PROD_REDIS_PORT:6379}
    password: ${PROD_REDIS_PASSWORD:}
    database: ${PROD_REDIS_DATABASE:0}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 20
        min-idle: 5
        max-wait: -1ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 110MB
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: ${PROD_JWT_SECRET:change-me}
  expiration: 86400000

file:
  upload-path: /data/open-platform/upload
  access-url: ${PROD_FILE_ACCESS_URL:https://localhost/files}

sso:
  enabled: true
  client-id: ${PROD_SSO_CLIENT_ID:}
  client-secret: ${PROD_SSO_CLIENT_SECRET:}
  authorization-uri: https://login.nstl.gov.cn/oauth/authorize
  token-uri: REDACTED
  user-info-uri: https://login.nstl.gov.cn/oauth/profile
  redirect-uri: ${PROD_SSO_REDIRECT_URI:https://localhost/callback}

sandbox:
  enabled: false
  service-url: ${PROD_SANDBOX_SERVICE_URL:http://127.0.0.1:8081}
  mockoon-url: ${PROD_MOCKOON_URL:http://127.0.0.1:3003}
  rate-limit: 60

logging:
  level:
    com.nstl.openplatform: warn
    org.springframework.security: warn
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

minio:
  endpoint: ${PROD_MINIO_ENDPOINT:http://127.0.0.1:9002}
  access-key: ${PROD_MINIO_ACCESS_KEY:}
  secret-key: ${PROD_MINIO_SECRET_KEY:}
  bucket-name: ${PROD_MINIO_BUCKET:nstl-open-platform-files}
